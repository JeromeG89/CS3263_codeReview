# Google Gemini via the public REST API. Needs GEMINI_API_KEY in .env (see .env.example).
# Model ids: Google renames/retires models, so check the ids below against
#   python scripts/list_gemini_models.py
# before a run. Extra keys in a model entry are passed to the provider as **opts (see src/invcheck/llm.py):
#   thinking_budget  0 disables "thinking" on 2.5 Flash models, so `direct` really answers directly
#   rpm              client-side rate limit in requests/minute, shared by all Gemini models in the process
#   label_suffix     appended to the model name in records; REQUIRED for any ablation of an already-listed
#                    model, otherwise its records collide with (and are skipped as) the base model's
run_name: gemini
workers: 2
max_repairs: 3
models:
  - {provider: gemini, model: "gemini-2.5-flash-lite", max_tokens: 4096, temperature: 0.0, thinking_budget: 0, rpm: 10}
  - {provider: gemini, model: "gemini-2.5-flash", max_tokens: 4096, temperature: 0.0, thinking_budget: 0, rpm: 10}
  # Ablation: let the model think (-1 = dynamic budget). Thinking tokens count against max_tokens.
  # - {provider: gemini, model: "gemini-2.5-flash", max_tokens: 4096, temperature: 0.0, thinking_budget: -1, rpm: 10, label_suffix: "+thinking"}
approaches: [direct, direct_cot, z3, z3_guided, z3_repair]
