witness: {dst: [], dst_len: 0, src: [5], src_len: 1}
unwind: 12
code: |
  void copy_prefix(int *dst, int dst_len, const int *src, int src_len) {
      int m = src_len > dst_len ? src_len : dst_len;
      for (int i = 0; i < m; i++) {
          dst[i] = src[i];
      }
  }
reference_z3: |
