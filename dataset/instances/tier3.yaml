  s.add(0 <= dst_len, dst_len <= 8, 0 <= src_len, src_len <= 8)
  m = If(src_len > dst_len, src_len, dst_len)
  viol = []
  for t in range(9):
      i = BitVecVal(t, 32)
      run = i < m
      viol.append(And(run, Or(i < 0, i >= dst_len, i >= src_len)))
  s.add(Or(viol))
