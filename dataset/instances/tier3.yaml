id: T3-DIV-02-U
pair: T3-DIV-02
label: unsafe
tier: 3
category: div_zero
twin: precondition
tags: [base_conversion]
description: Digit sum in a base that may be zero.
bug_explanation: base = 0 with x > 0 divides by zero in the first iteration.
entry: digit_sum
params:
  - {name: x, type: int}
  - {name: base, type: int}
requires: ["0 <= x && x <= 1000000", "0 <= base && base <= 16", "base != 1"]
witness: {x: 5, base: 0}
unwind: 24
code: |
  int digit_sum(int x, int base) {
      int s = 0;
      while (x > 0) {
          s += x % base;
          x /= base;
      }
      return s;
  }
reference_z3: |
  from z3 import *
  x, base = BitVecs('x base', 32)
  s = Solver()
  s.add(0 <= x, x <= 1000000, 0 <= base, base <= 16, base != 1)
  viol = []
  acc, xv, alive = BitVecVal(0, 32), x, BoolVal(True)
  for t in range(21):
      run = And(alive, xv > 0)
      viol.append(And(run, Or(base == 0, Not(BVSDivNoOverflow(xv, base)))))
      r = SRem(xv, base)
      viol.append(And(run, base != 0, Or(Not(BVAddNoOverflow(acc, r, True)), Not(BVAddNoUnderflow(acc, r)))))
      acc = If(run, acc + r, acc)
      xv = If(run, xv / base, xv)
      alive = run
  s.add(Or(viol))
---
