description: Copies max(src_len, dst_len) elements instead of the minimum.
bug_explanation: src_len > dst_len writes past the end of dst.
entry: copy_prefix
params:
  - {name: dst, type: "int[]", len: dst_len}
  - {name: dst_len, type: int}
  - {name: src, type: "int[]", len: src_len}
  - {name: src_len, type: int}
