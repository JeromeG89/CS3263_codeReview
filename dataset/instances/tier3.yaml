id: T3-DIV-01-U
pair: T3-DIV-01
label: unsafe
tier: 3
category: div_zero
twin: code
tags: [empty_input, counting]
description: Mean of the positive elements; there may be none.
bug_explanation: All elements <= 0 leaves cnt == 0.
entry: avg_positive
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
requires: ["1 <= n && n <= 8"]
elem_requires: {a: "-1000 <= _ && _ <= 1000"}
witness: {a: [-1], n: 1}
unwind: 12
code: |
  int avg_positive(const int *a, int n) {
      int sum = 0;
      int cnt = 0;
      for (int i = 0; i < n; i++) {
          if (a[i] > 0) {
              sum += a[i];
              cnt++;
          }
      }
      return sum / cnt;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 8)
  viol = []
  sm, cnt = BitVecVal(0, 32), BitVecVal(0, 32)
  for t in range(8):
      i = BitVecVal(t, 32)
      run = i < n
      e = a[i]
      s.add(Implies(And(0 <= i, i < n), And(-1000 <= e, e <= 1000)))
      viol.append(And(run, Or(i < 0, i >= n)))
      pos = And(run, e > 0)
      viol.append(And(pos, Or(Not(BVAddNoOverflow(sm, e, True)), Not(BVAddNoUnderflow(sm, e)))))
      sm = If(pos, sm + e, sm)
      cnt = If(pos, cnt + 1, cnt)
  viol.append(Or(cnt == 0, Not(BVSDivNoOverflow(sm, cnt))))
  s.add(Or(viol))
---
