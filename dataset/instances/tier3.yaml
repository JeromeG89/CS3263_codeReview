id: T3-BND-04-U
pair: T3-BND-04
label: unsafe
tier: 3
category: bounds
twin: code
tags: [unsigned_loop, wraparound]
description: Backwards loop with an unsigned counter; i >= 0 is always true.
bug_explanation: After i = 0 the counter wraps to UINT_MAX and a[UINT_MAX] is read.
entry: sum_backwards
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
requires: ["1 <= n && n <= 8"]
elem_requires: {a: "-1000 <= _ && _ <= 1000"}
witness: {a: [3], n: 1}
unwind: 12
code: |
  int sum_backwards(const int *a, int n) {
      int s = 0;
      for (unsigned i = n - 1; i >= 0; i--) {
          s += a[i];
      }
      return s;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 8)
  viol = []
  acc = BitVecVal(0, 32)
  i = n - 1                                # unsigned counter (same bits)
  for t in range(10):                      # unsigned i >= 0 is always true
      e = a[i]
      inb = ULT(i, n)                      # n > 0, so unsigned compare is exact
      s.add(Implies(inb, And(-1000 <= e, e <= 1000)))
      viol.append(Not(inb))
      viol.append(And(inb, Or(Not(BVAddNoOverflow(acc, e, True)), Not(BVAddNoUnderflow(acc, e)))))
      acc = acc + e
      i = i - 1
  s.add(Or(viol))
---
