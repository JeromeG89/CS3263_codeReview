description: Histogram where data values may equal the number of bins.
bug_explanation: A data value equal to bins indexes hist[bins].
entry: histogram
params:
  - {name: data, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: hist, type: "int[]", len: bins}
  - {name: bins, type: int}
requires: ["1 <= n && n <= 8", "1 <= bins && bins <= 16"]
elem_requires:
  data: "0 <= _ && _ <= bins"
  hist: "0 <= _ && _ <= 1000"
witness: {data: [1], n: 1, hist: [0], bins: 1}
unwind: 12
code: |
  void histogram(const int *data, int n, int *hist, int bins) {
      for (int i = 0; i < n; i++) {
          hist[data[i]]++;
      }
  }
reference_z3: |
  from z3 import *
  data = Array('data', BitVecSort(32), BitVecSort(32))
  hist = Array('hist', BitVecSort(32), BitVecSort(32))
  n, bins = BitVecs('n bins', 32)
  s = Solver()
  s.add(1 <= n, n <= 8, 1 <= bins, bins <= 16)
  viol = []
  h = hist
  for t in range(8):
      i = BitVecVal(t, 32)
      run = i < n
      d = data[i]
      s.add(Implies(And(0 <= i, i < n), And(0 <= d, d <= bins)))
      s.add(Implies(And(0 <= d, d < bins), And(0 <= hist[d], hist[d] <= 1000)))
      viol.append(And(run, Or(i < 0, i >= n)))
      viol.append(And(run, Or(d < 0, d >= bins)))
      cur = h[d]
      viol.append(And(run, Not(BVAddNoOverflow(cur, BitVecVal(1, 32), True))))
      h = If(run, Store(h, d, cur + 1), h)
  s.add(Or(viol))
