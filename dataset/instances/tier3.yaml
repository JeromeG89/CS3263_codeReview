description: In-place reversal swapping a[i] with a[n - i].
bug_explanation: At i = 0 the mirror index is n.
entry: reverse
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
requires: ["1 <= n && n <= 10"]
witness: {a: [1, 2], n: 2}
unwind: 12
code: |
  void reverse(int *a, int n) {
      for (int i = 0; i < n / 2; i++) {
          int tmp = a[i];
          a[i] = a[n - i];
          a[n - i] = tmp;
      }
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 10)
  viol = []
  for t in range(6):
      i = BitVecVal(t, 32)
      run = i < n / 2
      j = n - i
      viol.append(And(run, Or(i < 0, i >= n, j < 0, j >= n)))
  s.add(Or(viol))
