id: T3-BND-01-U
pair: T3-BND-01
label: unsafe
tier: 3
category: bounds
twin: code
tags: [off_by_one, loop_bound]
description: Array sum whose loop runs while i <= n.
bug_explanation: The last iteration reads a[n].
entry: sum
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
requires: ["1 <= n && n <= 8"]
elem_requires: {a: "-1000 <= _ && _ <= 1000"}
witness: {a: [1], n: 1}
unwind: 12
code: |
  int sum(const int *a, int n) {
      int s = 0;
      for (int i = 0; i <= n; i++) {
          s += a[i];
      }
      return s;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 8)
  viol = []
  acc = BitVecVal(0, 32)
  for t in range(10):                      # i = 0..n, at most 9 iterations
      i = BitVecVal(t, 32)
      run = i <= n
      e = a[i]
      s.add(Implies(And(0 <= i, i < n), And(-1000 <= e, e <= 1000)))
      viol.append(And(run, Or(i < 0, i >= n)))
      viol.append(And(run, Or(Not(BVAddNoOverflow(acc, e, True)), Not(BVAddNoUnderflow(acc, e)))))
      acc = If(run, acc + e, acc)
  s.add(Or(viol))
---
