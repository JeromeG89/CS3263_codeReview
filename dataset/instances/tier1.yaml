description: Integer slope where the two x coordinates may coincide.
bug_explanation: x1 == x2 makes the divisor zero.
entry: slope
params:
  - {name: x1, type: int}
  - {name: y1, type: int}
  - {name: x2, type: int}
  - {name: y2, type: int}
requires: ["-1000 <= x1 && x1 <= 1000", "-1000 <= y1 && y1 <= 1000", "-1000 <= x2 && x2 <= 1000", "-1000 <= y2 && y2 <= 1000", "x1 <= x2"]
witness: {x1: 3, y1: 0, x2: 3, y2: 9}
code: |
  int slope(int x1, int y1, int x2, int y2) {
      return (y2 - y1) / (x2 - x1);
  }
reference_z3: |
  from z3 import *
  x1, y1, x2, y2 = BitVecs('x1 y1 x2 y2', 32)
  s = Solver()
  for v in (x1, y1, x2, y2):
      s.add(-1000 <= v, v <= 1000)
  s.add(x1 <= x2)
  dy, dx = y2 - y1, x2 - x1
  s.add(Or(Not(BVSubNoOverflow(y2, y1)), Not(BVSubNoUnderflow(y2, y1, True)),
           Not(BVSubNoOverflow(x2, x1)), Not(BVSubNoUnderflow(x2, x1, True)),
           dx == 0, Not(BVSDivNoOverflow(dy, dx))))
