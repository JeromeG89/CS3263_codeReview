id: T1-DIV-02-U
pair: T1-DIV-02
label: unsafe
tier: 1
category: div_zero
twin: code
tags: [ineffective_guard]
description: Ternary guard tests the wrong condition (old < 0 instead of old == 0).
bug_explanation: old_v == 0 passes the guard and is used as divisor.
entry: percent_change
params:
  - {name: old_v, type: int}
  - {name: new_v, type: int}
requires: ["0 <= old_v && old_v <= 10000", "0 <= new_v && new_v <= 10000"]
witness: {old_v: 0, new_v: 5}
code: |
  int percent_change(int old_v, int new_v) {
      return old_v < 0 ? 0 : (new_v - old_v) * 100 / old_v;
  }
reference_z3: |
  from z3 import *
  old_v, new_v = BitVecs('old_v new_v', 32)
  s = Solver()
  s.add(0 <= old_v, old_v <= 10000, 0 <= new_v, new_v <= 10000)
  reach = Not(old_v < 0)
  d = new_v - old_v
  p = d * 100
  s.add(And(reach, Or(Not(BVSubNoOverflow(new_v, old_v)), Not(BVSubNoUnderflow(new_v, old_v, True)),
                      Not(BVMulNoOverflow(d, BitVecVal(100, 32), True)), Not(BVMulNoUnderflow(d, BitVecVal(100, 32))),
                      old_v == 0, Not(BVSDivNoOverflow(p, old_v)))))
---
