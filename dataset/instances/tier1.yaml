id: T1-BND-03-U
pair: T1-BND-03
label: unsafe
tier: 1
category: bounds
twin: precondition
tags: [negative_modulo, semantics_trap]
description: Hash reduced with %, but the hash may be negative and C's % keeps the dividend's sign.
bug_explanation: h = -1 gives h % size == -1, so table[-1] is read.
entry: bucket
params:
  - {name: table, type: "int[]", len: size}
  - {name: size, type: int}
  - {name: h, type: int}
requires: ["1 <= size && size <= 64"]
witness: {table: [0, 0, 0, 0], size: 4, h: -1}
code: |
  int bucket(const int *table, int size, int h) {
      return table[h % size];
  }
reference_z3: |
  from z3 import *
  table = Array('table', BitVecSort(32), BitVecSort(32))
  size, h = BitVecs('size h', 32)
  s = Solver()
  s.add(1 <= size, size <= 64)
  idx = SRem(h, size)          # C remainder, NOT Z3's bit-vector %
  s.add(Or(size == 0, Not(BVSDivNoOverflow(h, size)), idx < 0, idx >= size))
---
