# Tier 1: flat, straight-line functions (no loops; at most a ternary).
# Each pair = UNSAFE version (-U) + SAFE twin (-S); `twin` says whether they differ in code or preconditions.
---
id: T1-BND-01-U
pair: T1-BND-01
label: unsafe
tier: 1
category: bounds
twin: precondition
tags: [off_by_one]
description: Reads the element after i; i may be the last index.
bug_explanation: With i == n-1 the access buf[i+1] reads buf[n].
entry: next_item
params:
  - {name: buf, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: i, type: int}
requires: ["1 <= n && n <= 64", "0 <= i && i < n"]
witness: {buf: [7], n: 1, i: 0}
code: |
  int next_item(const int *buf, int n, int i) {
      return buf[i + 1];
  }
reference_z3: |
  from z3 import *
  buf = Array('buf', BitVecSort(32), BitVecSort(32))
  n, i = BitVecs('n i', 32)
  s = Solver()
  s.add(1 <= n, n <= 64, 0 <= i, i < n)
  idx = i + 1
  s.add(Or(Not(BVAddNoOverflow(i, BitVecVal(1, 32), True)), idx < 0, idx >= n))
---
id: T1-BND-01-S
pair: T1-BND-01
label: safe
tier: 1
category: bounds
twin: precondition
tags: [off_by_one]
description: Same code; precondition guarantees i+1 < n.
entry: next_item
params:
  - {name: buf, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: i, type: int}
requires: ["2 <= n && n <= 64", "0 <= i && i < n - 1"]
code_from: T1-BND-01-U
reference_z3: |
  from z3 import *
  buf = Array('buf', BitVecSort(32), BitVecSort(32))
  n, i = BitVecs('n i', 32)
  s = Solver()
  s.add(2 <= n, n <= 64, 0 <= i, i < n - 1)
  idx = i + 1
  s.add(Or(Not(BVAddNoOverflow(i, BitVecVal(1, 32), True)), idx < 0, idx >= n))
---
