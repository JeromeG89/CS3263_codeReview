id: T4-DIV-01-U
pair: T4-DIV-01
label: unsafe
tier: 4
category: div_zero
twin: code
tags: [helper_function, sentinel_value]
description: safe_div returns 0 as a sentinel, and the caller then divides by that result.
bug_explanation: total < parts (or parts == 0) makes per == 0, and x / per divides by zero.
entry: normalize
params:
  - {name: x, type: int}
  - {name: total, type: int}
  - {name: parts, type: int}
requires: ["0 <= x && x <= 1000", "0 <= total && total <= 1000", "0 <= parts && parts <= 10"]
witness: {x: 1, total: 0, parts: 5}
code: |
  static int safe_div(int a, int b) {
      if (b == 0) {
          return 0;
      }
      return a / b;
  }

  int normalize(int x, int total, int parts) {
      int per = safe_div(total, parts);
      return x / per;
  }
reference_z3: |
  from z3 import *
  x, total, parts = BitVecs('x total parts', 32)
  s = Solver()
  s.add(0 <= x, x <= 1000, 0 <= total, total <= 1000, 0 <= parts, parts <= 10)
  v1 = And(parts != 0, Not(BVSDivNoOverflow(total, parts)))
  per = If(parts == 0, BitVecVal(0, 32), total / parts)
  v2 = Or(per == 0, Not(BVSDivNoOverflow(x, per)))
  s.add(Or(v1, v2))
---
