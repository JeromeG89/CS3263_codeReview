id: T4-BND-02-U
pair: T4-BND-02
label: unsafe
tier: 4
category: bounds
twin: code
tags: [nested_loops, triangular_storage, off_by_one]
description: Sum over packed lower-triangular storage; inner loop runs to i + 1.
bug_explanation: In the last row the inner loop reads one element past n*(n+1)/2.
entry: tri_sum
params:
  - {name: tri, type: "int[]", len: "n * (n + 1) / 2"}
  - {name: n, type: int}
requires: ["1 <= n && n <= 6"]
elem_requires: {tri: "-1000 <= _ && _ <= 1000"}
witness: {tri: [4], n: 1}
unwind: 10
code: |
  int tri_sum(const int *tri, int n) {
      int s = 0;
      for (int i = 0; i < n; i++) {
          for (int j = 0; j <= i + 1; j++) {
              s += tri[i * (i + 1) / 2 + j];
          }
      }
      return s;
  }
reference_z3: |
  from z3 import *
  tri = Array('tri', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 6)
  L = n * (n + 1) / 2
  acc, viol = BitVecVal(0, 32), []
  for ti in range(6):
      i = BitVecVal(ti, 32)
      run_i = i < n
      for tj in range(ti + 2):             # j = 0 .. i+1
          j = BitVecVal(tj, 32)
          idx = i * (i + 1) / 2 + j
          e = tri[idx]
          s.add(Implies(And(0 <= idx, idx < L), And(-1000 <= e, e <= 1000)))
          viol.append(And(run_i, Or(idx < 0, idx >= L)))
          viol.append(And(run_i, Or(Not(BVAddNoOverflow(acc, e, True)), Not(BVAddNoUnderflow(acc, e)))))
          acc = If(run_i, acc + e, acc)
  s.add(Or(viol))
---
