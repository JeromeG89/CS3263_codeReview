  - {name: v, type: int}
  - {name: buckets, type: int}
requires: ["1 <= n && n <= 6", "0 <= v && v <= 1000", "1 <= buckets && buckets <= 100"]
elem_requires: {a: "0 <= _ && _ <= 1000"}
unwind: 10
code: |
  static int span(const int *a, int n) {
      int lo = a[0];
      int hi = a[0];
      for (int i = 1; i < n; i++) {
          if (a[i] < lo) {
              lo = a[i];
          }
          if (a[i] > hi) {
              hi = a[i];
          }
      }
      return hi - lo;
  }

  int bucket_of(const int *a, int n, int v, int buckets) {
      return (v - a[0]) * buckets / (span(a, n) + 1);
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n, v, buckets = BitVecs('n v buckets', 32)
  s = Solver()
  s.add(1 <= n, n <= 6, 0 <= v, v <= 1000, 1 <= buckets, buckets <= 100)
  for k in range(6):
      K = BitVecVal(k, 32)
      s.add(Implies(K < n, And(0 <= a[K], a[K] <= 1000)))
  viol = [n < 1]
  lo = hi = a[0]
  for t in range(1, 6):
      i = BitVecVal(t, 32)
      run = i < n
      e = a[i]
      lo = If(And(run, e < lo), e, lo)
      hi = If(And(run, e > hi), e, hi)
  d = hi - lo + 1
  num = (v - a[0]) * buckets
  viol.append(Or(d == 0, Not(BVSDivNoOverflow(num, d))))
  s.add(Or(viol))

