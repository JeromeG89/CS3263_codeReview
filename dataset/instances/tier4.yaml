description: The helper multiplies in 64 bits; the shifted result fits in int.
entry: fx_lerp
params:
  - {name: a, type: int}
  - {name: b, type: int}
  - {name: t, type: int}
requires: ["-32768 <= a && a <= 32768", "-32768 <= b && b <= 32768", "0 <= t && t <= 65536"]
code: |
  static int fx_mul(int a, int b) {
      return (int)(((long long)a * b) >> 16);
  }

  int fx_lerp(int a, int b, int t) {
      return a + fx_mul(b - a, t);
  }
reference_z3: |
  from z3 import *
  a, b, t = BitVecs('a b t', 32)
  s = Solver()
  s.add(-32768 <= a, a <= 32768, -32768 <= b, b <= 32768, 0 <= t, t <= 65536)
  d = b - a
  sub_bad = Or(Not(BVSubNoOverflow(b, a)), Not(BVSubNoUnderflow(b, a, True)))
  wd, wt = SignExt(32, d), SignExt(32, t)
  mul_bad = Or(Not(BVMulNoOverflow(wd, wt, True)), Not(BVMulNoUnderflow(wd, wt)))
  r = Extract(31, 0, (wd * wt) >> 16)      # (int) conversion: value fits, see add check
  add_bad = Or(Not(BVAddNoOverflow(a, r, True)), Not(BVAddNoUnderflow(a, r)))
  s.add(Or(sub_bad, mul_bad, add_bad))
