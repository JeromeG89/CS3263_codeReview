id: T4-BND-03-U
pair: T4-BND-03
label: unsafe
tier: 4
category: bounds
twin: code
tags: [two_pointer, short_circuit_order]
description: Two-pointer merge whose condition dereferences a[i] and b[j] before checking exhaustion.
bug_explanation: With m == 0 the first comparison already reads b[0].
entry: merge_count
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: b, type: "int[]", len: m}
  - {name: m, type: int}
  - {name: key, type: int}
requires: ["0 <= n && n <= 4", "0 <= m && m <= 4"]
elem_requires:
  a: "-100 <= _ && _ <= 100"
  b: "-100 <= _ && _ <= 100"
witness: {a: [1], n: 1, b: [], m: 0, key: 1}
unwind: 10
code: |
  int merge_count(const int *a, int n, const int *b, int m, int key) {
      int i = 0;
      int j = 0;
      int c = 0;
      while (i < n || j < m) {
          if (a[i] <= b[j] || j >= m) {
              if (a[i] == key) {
                  c++;
              }
              i++;
          } else {
              if (b[j] == key) {
                  c++;
              }
              j++;
          }
      }
      return c;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  b = Array('b', BitVecSort(32), BitVecSort(32))
  n, m, key = BitVecs('n m key', 32)
  s = Solver()
  s.add(0 <= n, n <= 4, 0 <= m, m <= 4)
  oob_a = lambda k: Or(k < 0, k >= n)
  oob_b = lambda k: Or(k < 0, k >= m)
  i, j, alive, viol = BitVecVal(0, 32), BitVecVal(0, 32), BoolVal(True), []
  for t in range(9):
      run = And(alive, Or(i < n, j < m))
      s.add(Implies(Not(oob_a(i)), And(-100 <= a[i], a[i] <= 100)))
      s.add(Implies(Not(oob_b(j)), And(-100 <= b[j], b[j] <= 100)))
      viol.append(And(run, Or(oob_a(i), oob_b(j))))          # a[i] <= b[j] reads both
      take_a = Or(a[i] <= b[j], j >= m)
      viol.append(And(run, take_a, oob_a(i)))
      viol.append(And(run, Not(take_a), oob_b(j)))
      i = If(And(run, take_a), i + 1, i)
      j = If(And(run, Not(take_a)), j + 1, j)
      alive = run
  s.add(Or(viol))
---
id: T4-BND-03-S
pair: T4-BND-03
label: safe
tier: 4
category: bounds
twin: code
tags: [two_pointer, short_circuit_order]
description: Checks exhaustion first and relies on && / || short-circuiting.
entry: merge_count
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: b, type: "int[]", len: m}
  - {name: m, type: int}
  - {name: key, type: int}
requires: ["0 <= n && n <= 4", "0 <= m && m <= 4"]
elem_requires:
  a: "-100 <= _ && _ <= 100"
  b: "-100 <= _ && _ <= 100"
unwind: 10
code: |
  int merge_count(const int *a, int n, const int *b, int m, int key) {
      int i = 0;
      int j = 0;
      int c = 0;
      while (i < n || j < m) {
          if (j >= m || (i < n && a[i] <= b[j])) {
              if (a[i] == key) {
                  c++;
              }
              i++;
          } else {
              if (b[j] == key) {
                  c++;
              }
              j++;
          }
      }
      return c;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  b = Array('b', BitVecSort(32), BitVecSort(32))
  n, m, key = BitVecs('n m key', 32)
  s = Solver()
  s.add(0 <= n, n <= 4, 0 <= m, m <= 4)
  oob_a = lambda k: Or(k < 0, k >= n)
  oob_b = lambda k: Or(k < 0, k >= m)
  i, j, alive, viol = BitVecVal(0, 32), BitVecVal(0, 32), BoolVal(True), []
  for t in range(9):                       # at most n + m <= 8 iterations
      run = And(alive, Or(i < n, j < m))
      s.add(Implies(Not(oob_a(i)), And(-100 <= a[i], a[i] <= 100)))
      s.add(Implies(Not(oob_b(j)), And(-100 <= b[j], b[j] <= 100)))
      c1 = j >= m
      reads = And(Not(c1), i < n)          # a[i] <= b[j] evaluated
      viol.append(And(run, reads, Or(oob_a(i), oob_b(j))))
      take_a = Or(c1, And(i < n, a[i] <= b[j]))
      viol.append(And(run, take_a, oob_a(i)))
      viol.append(And(run, Not(take_a), oob_b(j)))
      i = If(And(run, take_a), i + 1, i)
      j = If(And(run, Not(take_a)), j + 1, j)
      alive = run
  viol.append(And(alive, Or(i < n, j < m)))  # unrolling exhaustive (cannot happen)
  s.add(Or(viol))
---
