id: T4-OVF-02-U
pair: T4-OVF-02
label: unsafe
tier: 4
category: overflow
twin: precondition
tags: [helper_function, accumulation, numeric_boundary]
description: Weighted sum with power-of-two weights from a helper; elements up to 1e7.
bug_explanation: Eight elements of 1e7 give 1e7 * 255 = 2.55e9 > INT_MAX.
entry: weighted_sum
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
requires: ["1 <= n && n <= 8"]
elem_requires: {a: "-10000000 <= _ && _ <= 10000000"}
witness: {a: [10000000, 10000000, 10000000, 10000000, 10000000, 10000000, 10000000, 10000000], n: 8}
unwind: 12
code: |
  static int weight(int i) {
      return 1 << i;
  }

  int weighted_sum(const int *a, int n) {
      int s = 0;
      for (int i = 0; i < n; i++) {
          s += a[i] * weight(i);
      }
      return s;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n = BitVec('n', 32)
  s = Solver()
  s.add(1 <= n, n <= 8)
  acc, viol = BitVecVal(0, 32), []
  for t in range(8):
      i = BitVecVal(t, 32)
      run = i < n
      e = a[i]
      s.add(Implies(And(0 <= i, i < n), And(-10000000 <= e, e <= 10000000)))
      viol.append(And(run, Or(i < 0, i >= n)))
      w = BitVecVal(1 << t, 32)            # weight(i) = 1 << i with i in [0, 7]: shift is valid
      viol.append(And(run, Or(Not(BVMulNoOverflow(e, w, True)), Not(BVMulNoUnderflow(e, w)))))
      p = e * w
      viol.append(And(run, Or(Not(BVAddNoOverflow(acc, p, True)), Not(BVAddNoUnderflow(acc, p)))))
      acc = If(run, acc + p, acc)
  s.add(Or(viol))
---
