id: T4-BND-01-U
pair: T4-BND-01
label: unsafe
tier: 4
category: bounds
twin: code
tags: [helper_function, clamp, off_by_one]
description: Index clamped with a helper to [0, n] instead of [0, n-1].
bug_explanation: pos >= n is clamped to n, reading a[n].
entry: sample
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: pos, type: int}
requires: ["1 <= n && n <= 64"]
witness: {a: [1, 2], n: 2, pos: 9}
code: |
  static int clamp(int v, int lo, int hi) {
      if (v < lo) {
          return lo;
      }
      if (v > hi) {
          return hi;
      }
      return v;
  }

  int sample(const int *a, int n, int pos) {
      return a[clamp(pos, 0, n)];
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n, pos = BitVecs('n pos', 32)
  s = Solver()
  s.add(1 <= n, n <= 64)
  def clamp(v, lo, hi):
      return If(v < lo, lo, If(v > hi, hi, v))
  idx = clamp(pos, BitVecVal(0, 32), n)
  s.add(Or(idx < 0, idx >= n))
---
