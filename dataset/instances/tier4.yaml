id: T4-OVF-01-U
pair: T4-OVF-01
label: unsafe
tier: 4
category: overflow
twin: code
tags: [helper_function, fixed_point]
description: 16.16 fixed-point linear interpolation; the helper multiplies in 32 bits.
bug_explanation: (b - a) * t can reach 65536 * 65536 = 2^32.
entry: fx_lerp
params:
  - {name: a, type: int}
  - {name: b, type: int}
  - {name: t, type: int}
requires: ["-32768 <= a && a <= 32768", "-32768 <= b && b <= 32768", "0 <= t && t <= 65536"]
witness: {a: -32768, b: 32768, t: 65536}
code: |
  static int fx_mul(int a, int b) {
      return (a * b) >> 16;
  }

  int fx_lerp(int a, int b, int t) {
      return a + fx_mul(b - a, t);
  }
reference_z3: |
  from z3 import *
  a, b, t = BitVecs('a b t', 32)
  s = Solver()
  s.add(-32768 <= a, a <= 32768, -32768 <= b, b <= 32768, 0 <= t, t <= 65536)
  d = b - a
  sub_bad = Or(Not(BVSubNoOverflow(b, a)), Not(BVSubNoUnderflow(b, a, True)))
  mul_bad = Or(Not(BVMulNoOverflow(d, t, True)), Not(BVMulNoUnderflow(d, t)))
  r = (d * t) >> 16
  add_bad = Or(Not(BVAddNoOverflow(a, r, True)), Not(BVAddNoUnderflow(a, r)))
  s.add(Or(sub_bad, mul_bad, add_bad))
---
