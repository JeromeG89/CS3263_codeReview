tags: [helper_function, loop_in_helper, degenerate_input]
description: Bucket index divides by the value range computed by a helper; all-equal inputs give range 0.
bug_explanation: A single element (or all elements equal) makes span() return 0.
entry: bucket_of
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: v, type: int}
  - {name: buckets, type: int}
requires: ["1 <= n && n <= 6", "0 <= v && v <= 1000", "1 <= buckets && buckets <= 100"]
elem_requires: {a: "0 <= _ && _ <= 1000"}
witness: {a: [5], n: 1, v: 7, buckets: 3}
unwind: 10
code: |
  static int span(const int *a, int n) {
      int lo = a[0];
      int hi = a[0];
      for (int i = 1; i < n; i++) {
          if (a[i] < lo) {
              lo = a[i];
          }
          if (a[i] > hi) {
              hi = a[i];
          }
      }
      return hi - lo;
  }

  int bucket_of(const int *a, int n, int v, int buckets) {
      return (v - a[0]) * buckets / span(a, n);
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n, v, buckets = BitVecs('n v buckets', 32)
  s = Solver()
  s.add(1 <= n, n <= 6, 0 <= v, v <= 1000, 1 <= buckets, buckets <= 100)
  for k in range(6):
      K = BitVecVal(k, 32)
      s.add(Implies(K < n, And(0 <= a[K], a[K] <= 1000)))
  viol = [n < 1]                           # a[0] in bounds
  lo = hi = a[0]
  for t in range(1, 6):
      i = BitVecVal(t, 32)
      run = i < n
      e = a[i]
      lo = If(And(run, e < lo), e, lo)
      hi = If(And(run, e > hi), e, hi)
  sp = hi - lo                             # in [0, 1000], no overflow
  num = (v - a[0]) * buckets               # |num| <= 100000, no overflow
  viol.append(Or(sp == 0, Not(BVSDivNoOverflow(num, sp))))
  s.add(Or(viol))
---
