id: T4-SHF-01-U
pair: T4-SHF-01
label: unsafe
tier: 4
category: shift
twin: precondition
tags: [helper_function, negative_modulo, semantics_trap]
description: Bitset range count; lo may be negative, and C's i % 32 is then negative.
bug_explanation: i = -1 gives i % 32 == -1, a negative shift amount inside test_bit.
entry: count_set
params:
  - {name: words, type: "unsigned[]", len: nwords}
  - {name: nwords, type: int}
  - {name: lo, type: int}
  - {name: hi, type: int}
requires: ["1 <= nwords && nwords <= 2", "-8 <= lo && lo <= hi", "hi <= nwords * 32"]
witness: {words: [0], nwords: 1, lo: -1, hi: 0}
unwind: 75
code: |
  static int test_bit(const unsigned *words, int i) {
      return (int)((words[i / 32] >> (i % 32)) & 1u);
  }

  int count_set(const unsigned *words, int nwords, int lo, int hi) {
      int c = 0;
      for (int i = lo; i < hi; i++) {
          c += test_bit(words, i);
      }
      return c;
  }
reference_z3: |
  from z3 import *
  words = Array('words', BitVecSort(32), BitVecSort(32))
  nwords, lo, hi = BitVecs('nwords lo hi', 32)
  s = Solver()
  s.add(1 <= nwords, nwords <= 2, -8 <= lo, lo <= hi, hi <= nwords * 32)
  viol = []
  for t in range(72):                      # hi - lo <= 72
      i = lo + t
      run = i < hi
      q, r = i / 32, SRem(i, 32)
      viol.append(And(run, Or(q < 0, q >= nwords, r < 0, r >= 32)))
  s.add(Or(viol))
---
