description: A special-case branch whose condition is satisfiable (k in 6..8) reads tbl[k + 2].
bug_explanation: k = 6 takes the special branch and reads tbl[8] of an 8-element table.
entry: lookup_mode
params:
  - {name: tbl, type: "int[]", len: 8}
  - {name: k, type: int}
requires: ["-100 <= k && k <= 100"]
witness: {tbl: [0, 0, 0, 0, 0, 0, 0, 0], k: 6}
code: |
  int lookup_mode(const int *tbl, int k) {
      if (k > 5 && k < 9) {
          return tbl[k + 2];
      }
      if (k >= 0 && k < 8) {
          return tbl[k];
      }
      return 0;
  }
reference_z3: |
  from z3 import *
  tbl = Array('tbl', BitVecSort(32), BitVecSort(32))
  k = BitVec('k', 32)
  s = Solver()
  s.add(-100 <= k, k <= 100)
  p1 = And(k > 5, k < 9)
  p2 = And(Not(p1), k >= 0, k < 8)
  s.add(Or(And(p1, Or(k + 2 < 0, k + 2 >= 8)),
           And(p2, Or(k < 0, k >= 8))))
