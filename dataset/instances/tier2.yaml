tags: [path_condition, boundary]
description: Nested conditions intended to make y positive, but x >= 10 allows y == 0.
bug_explanation: x = 10, y = 0 reaches z / y.
entry: scaled
params:
  - {name: x, type: int}
  - {name: y, type: int}
  - {name: z, type: int}
requires: ["-1000 <= x && x <= 1000", "-1000 <= y && y <= 1000", "-1000 <= z && z <= 1000"]
witness: {x: 10, y: 0, z: 5}
code: |
  int scaled(int x, int y, int z) {
      if (x >= 10) {
          if (y == x - 10) {
              return z / y;
          }
      }
      return 0;
  }
reference_z3: |
  from z3 import *
  x, y, z = BitVecs('x y z', 32)
  s = Solver()
  for v in (x, y, z):
      s.add(-1000 <= v, v <= 1000)
  p_outer = x >= 10
  sub_bad = And(p_outer, Not(BVSubNoUnderflow(x, BitVecVal(10, 32), True)))
  reach = And(p_outer, y == x - 10)
  s.add(Or(sub_bad, And(reach, Or(y == 0, Not(BVSDivNoOverflow(z, y))))))
