tags: [off_by_one, ring_buffer]
description: Ring-buffer wrap check uses > instead of ==/>=.
bug_explanation: head == cap-1 gives next == cap, which is not > cap, so buf[cap] is written.
entry: ring_push
params:
  - {name: buf, type: "int[]", len: cap}
  - {name: cap, type: int}
  - {name: head, type: int}
  - {name: v, type: int}
requires: ["1 <= cap && cap <= 64", "0 <= head && head < cap"]
witness: {buf: [0, 0], cap: 2, head: 1, v: 9}
code: |
  void ring_push(int *buf, int cap, int head, int v) {
      int next = head + 1;
      if (next > cap) {
          next = 0;
      }
      buf[next] = v;
  }
reference_z3: |
  from z3 import *
  buf = Array('buf', BitVecSort(32), BitVecSort(32))
  cap, head, v = BitVecs('cap head v', 32)
  s = Solver()
  s.add(1 <= cap, cap <= 64, 0 <= head, head < cap)
  nxt = If(head + 1 > cap, BitVecVal(0, 32), head + 1)
  s.add(Or(Not(BVAddNoOverflow(head, BitVecVal(1, 32), True)), nxt < 0, nxt >= cap))
