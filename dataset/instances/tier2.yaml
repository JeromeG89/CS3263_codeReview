id: T2-BND-01-U
pair: T2-BND-01
label: unsafe
tier: 2
category: bounds
twin: code
tags: [off_by_one, clamp]
description: Clamps the index to [0, n] instead of [0, n-1].
bug_explanation: Any i >= n is clamped to n, so a[n] is read.
entry: clamped_get
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: i, type: int}
requires: ["1 <= n && n <= 64"]
witness: {a: [4], n: 1, i: 5}
code: |
  int clamped_get(const int *a, int n, int i) {
      if (i < 0) {
          i = 0;
      }
      if (i > n) {
          i = n;
      }
      return a[i];
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n, i = BitVecs('n i', 32)
  s = Solver()
  s.add(1 <= n, n <= 64)
  i1 = If(i < 0, BitVecVal(0, 32), i)
  i2 = If(i1 > n, n, i1)
  s.add(Or(i2 < 0, i2 >= n))
---
