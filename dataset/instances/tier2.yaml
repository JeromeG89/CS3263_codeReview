id: T2-DIV-04-U
pair: T2-DIV-04
label: unsafe
tier: 2
category: div_zero
twin: precondition
tags: [empty_input, counting]
description: Mean of the positive arguments; all three may be non-positive.
bug_explanation: a = b = c = 0 leaves cnt == 0.
entry: mean_of_positive
params:
  - {name: a, type: int}
  - {name: b, type: int}
  - {name: c, type: int}
requires: ["-1000 <= a && a <= 1000", "-1000 <= b && b <= 1000", "-1000 <= c && c <= 1000"]
witness: {a: 0, b: -5, c: 0}
code: |
  int mean_of_positive(int a, int b, int c) {
      int sum = 0;
      int cnt = 0;
      if (a > 0) {
          sum += a;
          cnt++;
      }
      if (b > 0) {
          sum += b;
          cnt++;
      }
      if (c > 0) {
          sum += c;
          cnt++;
      }
      return sum / cnt;
  }
reference_z3: |
  from z3 import *
  a, b, c = BitVecs('a b c', 32)
  s = Solver()
  for v in (a, b, c):
      s.add(-1000 <= v, v <= 1000)
  zero, one = BitVecVal(0, 32), BitVecVal(1, 32)
  cnt = If(a > 0, one, zero) + If(b > 0, one, zero) + If(c > 0, one, zero)
  sm = If(a > 0, a, zero) + If(b > 0, b, zero) + If(c > 0, c, zero)
  s.add(Or(cnt == 0, Not(BVSDivNoOverflow(sm, cnt))))
---
