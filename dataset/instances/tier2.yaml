id: T2-BND-02-U
pair: T2-BND-02
label: unsafe
tier: 2
category: bounds
twin: code
tags: [copy_paste, wrong_variable]
description: Bounds guard checks i twice and never checks j < n (copy-paste error).
bug_explanation: j >= n passes the guard, so a[j] is out of bounds.
entry: pair_sum
params:
  - {name: a, type: "int[]", len: n}
  - {name: n, type: int}
  - {name: i, type: int}
  - {name: j, type: int}
requires: ["1 <= n && n <= 64"]
elem_requires: {a: "-1000000 <= _ && _ <= 1000000"}
witness: {a: [1, 2], n: 2, i: 0, j: 5}
code: |
  int pair_sum(const int *a, int n, int i, int j) {
      if (i >= 0 && i < n && j >= 0 && i < n) {
          return a[i] + a[j];
      }
      return 0;
  }
reference_z3: |
  from z3 import *
  a = Array('a', BitVecSort(32), BitVecSort(32))
  n, i, j = BitVecs('n i j', 32)
  s = Solver()
  s.add(1 <= n, n <= 64)
  for x in (i, j):
      s.add(Implies(And(0 <= x, x < n), And(-1000000 <= a[x], a[x] <= 1000000)))
  reach = And(i >= 0, i < n, j >= 0, i < n)
  oob = Or(i < 0, i >= n, j < 0, j >= n)
  ovf = Or(Not(BVAddNoOverflow(a[i], a[j], True)), Not(BVAddNoUnderflow(a[i], a[j])))
  s.add(And(reach, Or(oob, ovf)))
---
