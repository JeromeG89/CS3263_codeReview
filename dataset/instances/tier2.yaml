entry: window_get
params:
  - {name: buf, type: "int[]", len: len}
  - {name: len, type: int}
  - {name: pos, type: int}
  - {name: start, type: int}
requires: ["1 <= len && len <= 64", "0 <= pos && pos <= 1000", "0 <= start && start <= 1000"]
witness: {buf: [1, 2, 3], len: 3, pos: 0, start: 1}
code: |
  int window_get(const int *buf, int len, int pos, int start) {
      int idx = pos - start;
      if (idx < len) {
          return buf[idx];
      }
      return -1;
  }
reference_z3: |
  from z3 import *
  buf = Array('buf', BitVecSort(32), BitVecSort(32))
  len_, pos, start = BitVec('len', 32), BitVec('pos', 32), BitVec('start', 32)
  s = Solver()
  s.add(1 <= len_, len_ <= 64, 0 <= pos, pos <= 1000, 0 <= start, start <= 1000)
  sub_bad = Or(Not(BVSubNoOverflow(pos, start)), Not(BVSubNoUnderflow(pos, start, True)))
  idx = pos - start
  s.add(Or(sub_bad, And(idx < len_, Or(idx < 0, idx >= len_))))
