id: STRESS-OVF-01-S
pair: STRESS-OVF-01
label: safe
tier: 4
category: overflow
twin: code
tags: [helper_function, broken_overflow_check, cert_int32]
description: Division-based check b <= INT_MAX / a, which cannot overflow for a > 0.
entry: scaled_total
params:
  - {name: qty, type: int}
  - {name: price, type: int}
requires: ["qty >= 0", "price >= 0"]
code: |
  #include <limits.h>

  static int mul_ok(int a, int b) {
      return a == 0 || b <= INT_MAX / a;
  }

  int scaled_total(int qty, int price) {
      if (!mul_ok(qty, price)) {
          return -1;
      }
      return qty * price;
  }
reference_z3: |
  from z3 import *
  qty, price = BitVecs('qty price', 32)
  s = Solver()
  s.add(qty >= 0, price >= 0)
  INT_MAX = BitVecVal(2**31 - 1, 32)
  check_bad = And(qty != 0, Or(qty == 0, Not(BVSDivNoOverflow(INT_MAX, qty))))
  ok = Or(qty == 0, price <= INT_MAX / qty)
  mul_bad = Or(Not(BVMulNoOverflow(qty, price, True)), Not(BVMulNoUnderflow(qty, price)))
  s.add(Or(check_bad, And(ok, mul_bad)))
